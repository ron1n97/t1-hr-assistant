services:
  t1-hr-assistant:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: t1-hr-assistant
    ports:
      - "8000:8000"
    environment:
      - SCIBOX_API_KEY=${SCIBOX_API_KEY}
      - WILLOW_SERVER_URL=${WILLOW_SERVER_URL:-http://localhost:8001}
      - WILLOW_API_KEY=${WILLOW_API_KEY:-}
      - PYTHONPATH=/app
      - UV_SYSTEM_PYTHON=1
      - ENVIRONMENT=${ENVIRONMENT:-development}
    env_file:
      - .env
    volumes:
      # Условное монтирование кода (только для разработки)
      - .:/app:${MOUNT_CODE:-ro}
      # Кэш uv для ускорения сборки
      - uv-cache:/root/.cache/uv
    # depends_on:
    #   whisper-server:
    #     condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - t1-hr-network

  t1-hr-frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: t1-hr-frontend
    ports:
      - "3000:3000"
    volumes:
      # Монтируем только исходный код для hot reload
      - ./web/frontend/src:/app/src
      - ./web/frontend/public:/app/public
      - ./web/frontend/index.html:/app/index.html
      - ./web/frontend/vite.config.ts:/app/vite.config.ts
      - ./web/frontend/tsconfig.json:/app/tsconfig.json
      - ./web/frontend/tailwind.config.js:/app/tailwind.config.js
      - ./web/frontend/postcss.config.js:/app/postcss.config.js
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - t1-hr-assistant
    restart: unless-stopped
    networks:
      - t1-hr-network

  # whisper-server убран - используется внешний сервер

  # Опциональный сервис для мониторинга (можно раскомментировать при необходимости)
  # nginx:
  #   image: nginx:alpine
  #   container_name: t1-hr-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - t1-hr-assistant
  #   networks:
  #     - t1-hr-network

volumes:
  uv-cache:
    driver: local

networks:
  t1-hr-network:
    driver: bridge
